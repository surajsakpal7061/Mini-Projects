<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;
            padding: 35px 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 28px;
            color: #222;
        }

        #count {
            font-size: 45px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #222;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            padding: 11px 22px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        #start {
            background: #198754;
        }

        #stop {
            background: #dc3545;
        }

        #reset {
            background: #555;
        }

        button:hover {
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.96);
        }

        @media (max-width: 500px) {

            .container {
                width: 90%;
            }

            #count {
                font-size: 35px;
            }

            .buttons {
                flex-wrap: wrap;
            }
        }
    </style>

    <div class="container">

        <h1>Stopwatch</h1>

        <div id="count">00:00:00</div>

        <div class="buttons">
            <button id="start">Start</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
